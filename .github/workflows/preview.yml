# HU-21 · Vista previa de cada pull request en Vercel.
#
# Cuando el CI del pull request pasa, publica el frontend en una URL de vista previa y la comenta en
# el PR. La vista previa usa la API de producción (sus orígenes están permitidos con el patrón
# https://sigepes-*.vercel.app en FRONTEND_URL). Si los secretos de Vercel no están, no hace nada.
name: Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_CLI: vercel@62.2.0

jobs:
  preview:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Sin secretos de Vercel: no se publica vista previa."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Compilar y publicar vista previa
        if: steps.config.outputs.ready == 'true'
        id: deploy
        env:
          VITE_API_BASE_URL: ${{ vars.API_URL && format('{0}/api/v1', vars.API_URL) || '/api/v1' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comentar la URL en el pull request
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Vista previa en Vercel para \`${SHA:0:7}\`: $URL"
          fi
