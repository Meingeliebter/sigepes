# Servidor del frontend en contenedor (docker compose).
# AC-21.5: estáticos comprimidos y cacheados; AC-21.4: cabeceras de seguridad.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Recursos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El service worker y el HTML nunca se cachean, para que un despliegue llegue de inmediato.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Misma origen para la API: evita CORS en el despliegue con docker compose.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # SPA: cualquier ruta del cliente sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
