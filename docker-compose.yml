# Stack completo de SIGEPES (HU-21): PostgreSQL + API + frontend servido por nginx.
#   docker compose up --build
# Abre http://localhost:8081 (frontend). La API queda detrás de nginx en /api.
# Los secretos se leen de un archivo .env junto a este archivo (ver .env.example); nunca se versionan.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigepes}
      POSTGRES_USER: ${POSTGRES_USER:-sigepes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigepes} -d ${POSTGRES_DB:-sigepes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sigepes}
      DATABASE_USER: ${POSTGRES_USER:-sigepes}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      UPLOADS_DIR: /var/data/uploads
    volumes:
      - uploads:/var/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  postgres-data:
  uploads:
