# Blueprint de Render para la API y la base de datos (HU-21).
# En Render: New → Blueprint → selecciona este repositorio. Los valores marcados con sync: false
# se escriben en el panel de Render (almacén de secretos), nunca en este archivo (AC-21.4).
services:
  - type: web
    name: sigepes-api
    runtime: docker
    rootDir: backend
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: false            # el despliegue lo dispara .github/workflows/deploy.yml tras CI verde
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false              # p. ej. https://sigepes.vercel.app
      - key: SEED_DEMO_DATA
        value: "true"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        sync: false              # jdbc:postgresql://<host>:5432/<db> (Render entrega host y db en la BD)
      - key: DATABASE_USER
        fromDatabase:
          name: sigepes-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: sigepes-db
          property: password
    disk:                        # AC-15.6: archivos subidos fuera del contenedor
      name: sigepes-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: sigepes-db
    databaseName: sigepes
    plan: basic-256mb
