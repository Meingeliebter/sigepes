# Perfil de pruebas: H2 en memoria, aislado por clase de test.
# Flyway se ejecuta igual que en dev/prod, de modo que las migraciones quedan probadas.
spring.datasource.url=jdbc:h2:mem:sigepes-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

sigepes.security.jwt-secret=test-secret-for-sigepes-unit-tests-32-bytes
sigepes.security.expiration-seconds=3600
sigepes.security.login-attempts-per-minute=1000
sigepes.cors.allowed-origins=http://localhost:5173
sigepes.seed.enabled=false
sigepes.rules.permit-expiry-warning-days=30
sigepes.rules.subsistence-permit-types=SUBSISTENCIA,PESCA DE SUBSISTENCIA

logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
