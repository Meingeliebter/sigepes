# Perfil prod: todas las credenciales llegan por variables de entorno.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
sigepes.security.jwt-secret=${JWT_SECRET}
sigepes.seed.enabled=${SEED_DEMO_DATA:false}
spring.jpa.show-sql=false
sigepes.cors.allowed-origins=${FRONTEND_URL}
# AC-15.6: los archivos viven en un disco persistente montado por la plataforma, nunca en el contenedor.
sigepes.storage.uploads-dir=${UPLOADS_DIR:/var/data/uploads}
logging.level.com.sigepes.backend=INFO
