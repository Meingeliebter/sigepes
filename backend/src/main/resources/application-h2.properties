# Perfil h2: ejecución local inmediata, sin Docker ni PostgreSQL. Los datos se pierden al parar.
spring.datasource.url=jdbc:h2:mem:sigepes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
logging.level.com.sigepes.backend=DEBUG
