spring.application.name=sigepes-backend
# PORT: puerto que asigna la plataforma (Render); API_PORT para ejecución local.
server.port=${API_PORT:${PORT:8080}}
spring.profiles.default=dev

# --- Seguridad / JWT -------------------------------------------------
sigepes.security.jwt-secret=${JWT_SECRET}
sigepes.security.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
sigepes.security.login-attempts-per-minute=${LOGIN_ATTEMPTS_PER_MINUTE:10}
sigepes.security.public-requests-per-minute=${PUBLIC_REQUESTS_PER_MINUTE:20}
# AC-20.5: umbral de fallos de login por IP en la ventana reciente que dispara una alerta de seguridad
sigepes.security.brute-force-window-minutes=${BRUTE_FORCE_WINDOW_MINUTES:15}
sigepes.security.brute-force-threshold=${BRUTE_FORCE_THRESHOLD:5}

# --- CORS ------------------------------------------------------------
sigepes.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# --- Reglas de negocio -----------------------------------------------
# Umbrales (días de antelación) en los que un permiso genera alerta de vencimiento (AC-08.2)
sigepes.rules.permit-expiry-warning-days=${PERMIT_EXPIRY_WARNING_DAYS:30,15,5}
# Tipos de permiso considerados "de subsistencia" (excepción de RN-16 y de vedas parciales)
sigepes.rules.subsistence-permit-types=SUBSISTENCIA,PESCA DE SUBSISTENCIA

# --- Datos de demostración ------------------------------------------
sigepes.seed.enabled=${SEED_DEMO_DATA:true}

# --- Almacenamiento de archivos (AC-08.5) -----------------------------
# En despliegue real (Docker) debe apuntar a un volumen persistente.
sigepes.storage.uploads-dir=${UPLOADS_DIR:uploads}
sigepes.storage.max-file-size-mb=${UPLOADS_MAX_FILE_SIZE_MB:8}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=20MB

# --- Persistencia ----------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sigepes}
spring.datasource.username=${DATABASE_USER:sigepes}
spring.datasource.password=${DATABASE_PASSWORD:sigepes}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Documentación ---------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Operación (HU-21) ------------------------------------------------
# AC-21.3: solo se expone el health check; sin detalles, para no filtrar información interna.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Detrás del proxy HTTPS de la plataforma: respeta X-Forwarded-Proto/For (IP real en auditoría, HSTS).
server.forward-headers-strategy=framework
# Respuestas comprimidas (AC-21.5)
server.compression.enabled=true
server.compression.mime-types=application/json,text/csv,text/plain
